aid: mycotechnology
name: MycoTechnology
description: 'MycoTechnology, Inc. is a Colorado-based food ingredient technology company
  that uses mushroom mycelial fermentation to create naturally derived ingredients for
  the food and beverage industry. Operating publicly as Myco (mycoiq.com), the company
  develops and manufactures flavor-modulation and sweetening ingredients — ClearIQ natural
  flavor, ClearHT natural flavor, and Zukora honey truffle sweet protein — used for bitterness
  masking, off-note mitigation, sugar reduction, and clean-label formulation in plant proteins,
  meat analogues, dairy alternatives, and health and wellness products. It also offers
  Fermentation as a Service (FaaS) and a MyCulinary culinary science program for food brands.
  This is an ingredient manufacturing and food science business, not a software or API company:
  it publishes no developer portal, no API documentation, and no machine-readable API contract.'
